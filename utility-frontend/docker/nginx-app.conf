# Serves the dashboard bundle.
#
# This sits behind the edge proxy, which forwards paths unchanged, so requests
# arrive still prefixed with /app. The bundle is therefore placed in an /app
# subdirectory and served with `root` rather than `alias`: combining alias with a
# try_files fallback resolves the fallback inconsistently across nginx versions,
# which breaks deep links in a way that only shows up on a page refresh.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Not part of the bundle: the container healthcheck needs something that does
    # not depend on the SPA fallback working.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed filenames change whenever content changes, so these can be cached
    # indefinitely. Without it a returning user re-downloads the whole bundle.
    location ^~ /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /app/ {
        # index.html is deliberately never cached: it names the current asset
        # hashes, so a stale copy would request a bundle that no longer exists.
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # An unknown path under /app is a client-side route, not a missing file,
        # so it must return the shell instead of a 404.
        try_files $uri $uri/ /app/index.html;
    }

    # A bare /app has no trailing slash and would not match the block above.
    location = /app {
        return 301 /app/;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
