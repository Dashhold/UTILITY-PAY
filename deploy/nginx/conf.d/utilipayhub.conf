# Edge configuration for utilipayhub.com.
#
# Routing, in order of specificity:
#   /api/     -> Go API
#   /readyz   -> Go API (uptime checks)
#   /app/     -> dashboard bundle
#   /         -> marketing site
#
# Everything is one origin, so the browser never makes a cross-origin request and
# there is no CORS preflight on any API call.
#
# Backends are addressed through variables rather than `upstream` blocks. nginx
# resolves an upstream name once at configuration load, which has two consequences
# worth avoiding: it refuses to start at all if a backend is briefly unavailable,
# taking the whole site down over one slow container; and it keeps the old address
# after a container is recreated, so every request 502s until nginx is reloaded.
# Resolving per request against Docker's embedded DNS avoids both.

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# HTTP. Serves the ACME challenge and, once certificates exist, redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name utilipayhub.com www.utilipayhub.com _;

    # Set here so they are resolved at request time.
    set $api_upstream     "api:8080";
    set $app_upstream     "app:80";
    set $landing_upstream "landing:3000";

    # Certbot writes its challenge here. It must stay reachable over plain HTTP or
    # renewal fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Answered by the proxy itself: the container healthcheck runs before any
    # certificate exists and must not depend on a backend being up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Longest matching prefix wins, so this takes precedence over /api/ and
    # applies the tighter limit that blunts credential stuffing.
    location ^~ /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://$api_upstream;
    }

    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://$api_upstream;
    }

    location = /readyz {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://$api_upstream;
    }

    location ^~ /app {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://$app_upstream;
    }

    location / {
        # Enable after running deploy/init-letsencrypt.sh. Until then the site is
        # served over HTTP so a fresh instance is usable immediately.
        return 301 https://$host$request_uri;
    }
}

# HTTPS. Commented out until certificates exist, because nginx refuses to start
# when ssl_certificate points at a missing file — which would take the whole site
# down on a first deploy. Run deploy/init-letsencrypt.sh, then uncomment this
# block and the redirect above.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 disabled due to protocol errors with Next.js Image Optimization
    server_name utilipayhub.com www.utilipayhub.com;

    set $api_upstream     "api:8080";
    set $app_upstream     "app:80";
    set $landing_upstream "landing:3000";

    ssl_certificate     /etc/letsencrypt/live/utilipayhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utilipayhub.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/utilipayhub.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Only enable HSTS once HTTPS is confirmed working: a browser that sees this
    # will refuse plain HTTP for the whole period, so a broken certificate becomes
    # a hard outage rather than a warning.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ^~ /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://$api_upstream;
    }

    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass http://$api_upstream;
    }

    location = /readyz {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://$api_upstream;
    }

    location ^~ /app {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://$app_upstream;
    }

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass http://$landing_upstream;
    }
}
