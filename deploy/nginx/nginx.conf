user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The real client IP is behind the proxy chain, so it is logged explicitly;
    # otherwise every request appears to come from the Docker bridge.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # KYC uploads are capped at 5 MB by the API. This is set slightly higher so
    # the API returns its own clear error rather than nginx cutting the request
    # off with a bare 413.
    client_max_body_size 8m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Login and the provider-facing transaction endpoints are the two things worth
    # rate limiting: the first against credential stuffing, the second because each
    # call costs an upstream request.
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
