# Headers every proxied request needs.
#
# Without X-Forwarded-* the API sees the Docker bridge address as the client IP,
# which would make login-history rows and rate limiting useless.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Cleared rather than forwarded: passing the client's Connection header through
# would tear down the connection to the backend on every request.
proxy_set_header Connection "";

proxy_connect_timeout 10s;

# Read and send timeouts are deliberately NOT set here. api-proxy.conf raises them
# for the provider-backed endpoints, and nginx rejects a duplicate directive in the
# same block, so setting them in both snippets would fail the configuration test.

