# API-specific proxy behaviour. Included alongside proxy-headers.conf, which
# deliberately leaves the read and send timeouts to this file.

# Bill fetch, payment and status calls wait on MobiKwik, whose own timeout is 45s.
# The proxy has to outlast that or nginx would return 504 while the transaction is
# still in flight upstream — leaving the retailer with no answer for a payment that
# may well have succeeded.
proxy_read_timeout 90s;
proxy_send_timeout 90s;

# Buffering is off so a slow upstream response reaches the client as it arrives
# rather than being held until complete. It also means KYC document downloads
# stream instead of being spooled to disk.
proxy_buffering off;
proxy_request_buffering off;

# The API already sets no-store on anything sensitive; this makes sure no
# intermediate cache holds an API response regardless.
proxy_no_cache 1;
proxy_cache_bypass 1;

# Retrying a POST that timed out could double-charge a retailer, so a failed
# request is never replayed against another upstream.
proxy_next_upstream off;
